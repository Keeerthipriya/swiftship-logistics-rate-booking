<div class="parcel-card">
  <div class="card-header">
    <div class="badge-icon">📦</div>
    <div>
      <h3 class="card-title">1. Parcel Specifications</h3>
      <p class="card-subtitle">Specify weight and shipping distance to compute dynamic rates.</p>
    </div>
  </div>

  <div class="form-grid">
    <div class="form-group">
      <label for="weightInput" class="form-label">
        Parcel Weight (kg) <span class="required">*</span>
      </label>
      <div class="input-wrapper">
        <input
          id="weightInput"
          type="number"
          step="0.1"
          min="0.1"
          max="50.0"
          [ngModel]="weight()"
          (ngModelChange)="onWeightChange($event)"
          placeholder="e.g. 5.0"
          class="form-control"
          [class.is-invalid]="weightError()"
        />
        <span class="input-suffix">kg</span>
      </div>
      @if (weightError()) {
        <p class="error-text">{{ weightError() }}</p>
      } @else {
        <span class="helper-text">Allowed range: 0.1 kg – 50.0 kg</span>
      }
    </div>

    <div class="form-group">
      <label for="distanceInput" class="form-label">
        Delivery Distance (km) <span class="required">*</span>
      </label>
      <div class="input-wrapper">
        <input
          id="distanceInput"
          type="number"
          step="1"
          min="1"
          max="2500"
          [ngModel]="distance()"
          (ngModelChange)="onDistanceChange($event)"
          placeholder="e.g. 75"
          class="form-control"
          [class.is-invalid]="distanceError()"
        />
        <span class="input-suffix">km</span>
      </div>
      @if (distanceError()) {
        <p class="error-text">{{ distanceError() }}</p>
      } @else {
        <span class="helper-text">Allowed range: 1 km – 2,500 km</span>
      }
    </div>
  </div>
</div>
